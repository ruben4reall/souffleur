name: Idea
description: Something that would make Souffleur better
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you have
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like Souffleur to do
    validations:
      required: true
  - type: checkboxes
    id: promises
    attributes:
      label: Souffleur's promises
      options:
        - label: My idea keeps the voice on the Mac, and adds no account, no telemetry and no network connection.
          required: true
