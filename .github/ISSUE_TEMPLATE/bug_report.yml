name: Bug report
description: Something does not work the way Souffleur says it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what Souffleur did.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a script in French
        2. Press Prompt in Voice Follow
  - type: input
    id: mac
    attributes:
      label: Mac model and macOS version
      placeholder: MacBook Pro 14-inch, M3 Pro, macOS 26.5
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Souffleur version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Scrolling mode
      options: [Voice Follow, Voice Pace, Auto Scroll, Manual]
